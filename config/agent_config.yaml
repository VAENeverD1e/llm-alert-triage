# LLM Agent & Triage Pipeline Configuration

models:
  primary:
    provider: "ollama"
    model_name: "llama3:8b"
    base_url: "http://localhost:11434"
    temperature: 0.1
    max_tokens: 2048
    timeout_seconds: 30

  fallback:
    provider: "ollama"
    model_name: "mistral:7b"
    base_url: "http://localhost:11434"
    temperature: 0.0
    max_tokens: 2048

pipeline:
  context_window_minutes: 5
  max_events_per_alert: 50
  confidence_threshold_escalate: 0.70
  confidence_threshold_close: 0.85
  default_action_on_failure: "Escalate"

tool_permissions:
  allow_elastic_queries: true
  allow_playbook_rag: true
  allow_network_lookups: false
  allow_system_commands: false

prompt_injection_guard:
  enabled: true
  sanitize_fields:
    - "process.command_line"
    - "user.name"
    - "host.hostname"
    - "message"
